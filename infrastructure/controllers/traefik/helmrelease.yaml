---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 40.2.0 # Traefik v3.7
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    # Gateway API is the routing surface; Ingress/IngressRoute providers stay
    # available but unused.
    providers:
      kubernetesGateway:
        enabled: true
    # The chart's own Gateway/GatewayClass objects are disabled — the shared
    # Gateway is defined in infrastructure/config/gateway.yaml.
    gateway:
      enabled: false
    gatewayClass:
      enabled: true

    service:
      annotations:
        # Stable LAN VIP — split-horizon DNS points *.nb3.me here.
        # Must stay outside the libvirt DHCP range.
        metallb.io/loadBalancerIPs: 192.168.122.200

    # Redirect entrypoint-wide: every HTTP request goes to HTTPS.
    # Chart 40.x nests redirections under ports.web.http (not ports.web).
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

    logs:
      access:
        enabled: true
