---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-stack
  namespace: monitoring
spec:
  interval: 1h
  # Pulls several images (operator, vmsingle, vmagent, grafana, ksm, node-exporter)
  # onto a small node — give the install room and let Flux remediate timeouts.
  timeout: 15m
  install:
    # The chart ships the operator CRDs as plain manifests (crds.plain below);
    # let Helm create/replace them so Flux applies CRD updates on upgrade too.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.85.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:
    victoria-metrics-operator:
      # Render CRDs as ordinary chart manifests (GitOps-friendly: no operator
      # job races, Helm + Flux manage them via install/upgrade.crds above).
      crds:
        plain: true

    # ---- Storage / query backend -------------------------------------------
    vmsingle:
      spec:
        retentionPeriod: "30d"
        # On node01 since 2026-10-23 to take ~270m CPU and ~740Mi off sowilo
        # (node01: 2 cores, 7.4 GiB, ~6% busy). Its single Longhorn replica was
        # moved to node01 with it, so TSDB I/O stays local. Cost: while nuc2
        # is down, Grafana/vmalert have no backend; vmagent stays on sowilo and
        # buffers samples until vmsingle is back.
        nodeSelector:
          kubernetes.io/hostname: node01
        # 12Gi of metrics is not worth an off-site copy: leave Longhorn's
        # default backup group (infrastructure/controllers/longhorn/recurringjob-backup.yaml).
        storageMetadata:
          labels:
            recurring-job-source.longhorn.io: enabled
            recurring-job-group.longhorn.io/no-backup: enabled
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          resources:
            requests:
              # 4Gi did NOT hold 30d: it filled in ~32 days (3.8/3.9 GiB) and
              # vmsingle flipped to read-only (free 99.6 MB < the 100 MB default
              # -storage.minFreeDiskSpaceBytes), silently stopping ALL ingestion
              # while still answering historical queries. 156k series, ~46% of
              # them apiserver/etcd histogram buckets — now dropped at scrape
              # time, see vmagent.globalScrapeMetricRelabelConfigs below.
              #
              # 12Gi was first REJECTED by Longhorn's admission webhook
              # ("CheckReplicasSizeExpansion ... CurrentAvailable is less than
              # or equal to MinimalAvailable"): sowilo's root fs was 82% full,
              # so its Longhorn disk sat at Schedulable=False/DiskPressure —
              # below the 25% floor, which denies ANY expansion and any new
              # replica. Root cause was NOT Longhorn: a runaway json-file log
              # of the tgmusicbot Docker container (30.6 GiB in
              # /var/lib/docker/containers, ~3.4 GiB/day, no rotation
              # configured). Truncated -> 59.9 GiB free -> expansion allowed.
              # Keep an eye on `df /` on sowilo before raising this again.
              storage: 12Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            # 512Mi OOM-looped (exit 137) under the heavy "Node Exporter Full"
            # dashboard's range queries, which 500'd Grafana. 2Gi gives the TSDB
            # room to answer them (sowilo has 15 GiB).
            memory: 2Gi

    # ---- Scraper ------------------------------------------------------------
    vmagent:
      spec:
        # Pin to sowilo: node01 lives on the flaky robothost hypervisor. If the
        # scraper ran on node01 it would die at the same instant robothost
        # crashes, losing the pre-crash temp/CPU samples. On sowilo it keeps
        # scraping robothost (192.168.1.26) right up to the crash and survives
        # the node01 outage so monitoring/alerting stay up.
        nodeSelector:
          kubernetes.io/hostname: sowilo
        # Chart default 20s kept vmagent+vmsingle at ~0.6 core on sowilo. Not
        # higher than 30s: 4 default alert rules use [1m] windows, which need
        # two samples. The two 82k-sample k3s endpoints scrape at 2m (below).
        scrapeInterval: 30s
        # Pick up every VMServiceScrape / VMStaticScrape across namespaces
        # (incl. our bare-metal VMStaticScrape in the monitoring ns).
        selectAllByDefault: true
        # Drop apiserver/etcd histogram buckets before ingestion. They were
        # ~72k of 156k series (apiserver_request_duration_seconds_bucket 23.4k,
        # etcd_request_duration_seconds_bucket 19k, request_sli 9.4k,
        # watch_list 6.7k, request_body_size 6k, watch_cache_read_wait 4.7k,
        # watch_events_sizes 3.1k) — the reason a 4Gi TSDB filled in a month on
        # a 2-node homelab. Cost: latency/SLO panels on the "Kubernetes / API
        # server" + "etcd" dashboards and the cluster_quantile:* recording
        # rules go empty. Hardware/node/pod metrics are untouched.
        # Applied as metric_relabel_configs to every scrape job.
        globalScrapeMetricRelabelConfigs:
          - action: drop
            source_labels: [__name__]
            regex: "(apiserver|etcd)_.*_bucket"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

    # ---- Alerting -----------------------------------------------------------
    defaultRules:
      enabled: true
    vmalert:
      enabled: true
      spec:
        # Pin to sowilo with vmagent/alertmanager. Its queries go to vmsingle on
        # node01, so no rule evaluates while node01 is down.
        nodeSelector:
          kubernetes.io/hostname: sowilo
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
    alertmanager:
      enabled: true
      spec:
        # Pin to sowilo so alerting fires even when node01 is down.
        nodeSelector:
          kubernetes.io/hostname: sowilo
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
      # Inline config. Receiver is a no-op for now — a real channel (Telegram/
      # email/Slack) gets wired in a follow-up via a SOPS secret + configSecret.
      config:
        route:
          receiver: "blackhole"
          group_by: ["alertname", "instance"]
        receivers:
          - name: "blackhole"

    # ---- k3s component scrapes ----------------------------------------------
    # k3s runs every component in one process with one metrics registry, so the
    # apiserver endpoint and sowilo's kubelet /metrics each return the SAME
    # ~82.6k samples (apiserver+etcd+scheduler+kubelet), mostly dropped by the
    # bucket filter above. Rendering and parsing them every 20s cost k3s-server
    # and vmagent CPU; 2m keeps the counters/gauges at a quarter of the cost.
    # Endpoint lists replace the chart's, so the whole endpoint is restated.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              interval: 2m
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
    kubelet:
      vmScrapes:
        kubelet:
          spec:
            interval: 2m

    # ---- Host & object exporters -------------------------------------------
    prometheus-node-exporter:
      enabled: true
      # Run on every node, including the control-plane/server node.
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          memory: 96Mi

    # ---- Dashboards ---------------------------------------------------------
    defaultDashboards:
      enabled: true

    # Grafana's $__rate_interval is 4x the datasource scrape interval (15s if
    # unset); with 30s samples a 1m window holds one point and rate() is empty.
    # The list replaces the chart's, so both default datasources are restated.
    defaultDatasources:
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true
            jsonData:
              timeInterval: 30s
          - name: VictoriaMetrics (DS)
            isDefault: false
            access: proxy
            uid: VictoriaMetricsDS
            type: victoriametrics-metrics-datasource
            jsonData:
              timeInterval: 30s

    # ---- Grafana ------------------------------------------------------------
    grafana:
      enabled: true
      # RWO Longhorn PVC: the chart's RollingUpdate starts the new pod first and
      # it waits forever on a Multi-Attach error when it lands on another node.
      deploymentStrategy:
        type: Recreate
      # On node01 next to vmsingle since 2026-10-23; its single Longhorn
      # replica was moved there too.
      nodeSelector:
        kubernetes.io/hostname: node01
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 2Gi
        storageClassName: longhorn
      resources:
        requests:
          cpu: 50m
          # Grafana with provisioned dashboards/datasources idles ~300-350Mi;
          # the old 256Mi limit OOM-killed it (exit 137) in a restart loop,
          # which is what made the UI slow/flaky to load.
          memory: 256Mi
        limits:
          memory: 512Mi
      # "Node Exporter Full" (temperature + CPU/RAM/disk/net per host).
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            revision: 37
            datasource: VictoriaMetrics
