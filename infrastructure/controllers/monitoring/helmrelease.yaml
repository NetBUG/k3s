---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-stack
  namespace: monitoring
spec:
  interval: 1h
  # Pulls several images (operator, vmsingle, vmagent, grafana, ksm, node-exporter)
  # onto a small node — give the install room and let Flux remediate timeouts.
  timeout: 15m
  install:
    # The chart ships the operator CRDs as plain manifests (crds.plain below);
    # let Helm create/replace them so Flux applies CRD updates on upgrade too.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.85.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:
    victoria-metrics-operator:
      # Render CRDs as ordinary chart manifests (GitOps-friendly: no operator
      # job races, Helm + Flux manage them via install/upgrade.crds above).
      crds:
        plain: true

    # ---- Storage / query backend -------------------------------------------
    vmsingle:
      spec:
        retentionPeriod: "30d"
        # Pin to sowilo (15 GiB RAM) — node01 is a flaky 4 GiB guest and the
        # query backend needs headroom. Its Longhorn data has a replica here.
        nodeSelector:
          kubernetes.io/hostname: sowilo
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          resources:
            requests:
              # node1's disk is small (46 GiB) and Longhorn reserves ~30%, so
              # headroom after paperless+grafana is ~7 GiB. VM is space-efficient;
              # 4 GiB holds plenty of hardware/k8s metrics at 30d for this scale.
              # Bump once node2 adds disk.
              storage: 4Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            # 512Mi OOM-looped (exit 137) under the heavy "Node Exporter Full"
            # dashboard's range queries, which 500'd Grafana. 2Gi gives the TSDB
            # room to answer them (sowilo has 15 GiB).
            memory: 2Gi

    # ---- Scraper ------------------------------------------------------------
    vmagent:
      spec:
        # Pick up every VMServiceScrape / VMStaticScrape across namespaces
        # (incl. our bare-metal VMStaticScrape in the monitoring ns).
        selectAllByDefault: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

    # ---- Alerting -----------------------------------------------------------
    defaultRules:
      enabled: true
    vmalert:
      enabled: true
      spec:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
    alertmanager:
      enabled: true
      spec:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
      # Inline config. Receiver is a no-op for now — a real channel (Telegram/
      # email/Slack) gets wired in a follow-up via a SOPS secret + configSecret.
      config:
        route:
          receiver: "blackhole"
          group_by: ["alertname", "instance"]
        receivers:
          - name: "blackhole"

    # ---- Host & object exporters -------------------------------------------
    prometheus-node-exporter:
      enabled: true
      # Run on every node, including the control-plane/server node.
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          memory: 96Mi

    # ---- Dashboards ---------------------------------------------------------
    defaultDashboards:
      enabled: true

    # ---- Grafana ------------------------------------------------------------
    grafana:
      enabled: true
      # Pin to sowilo (away from the flaky node01); its Longhorn PVC has a
      # replica here so it stays put with its data.
      nodeSelector:
        kubernetes.io/hostname: sowilo
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 2Gi
        storageClassName: longhorn
      resources:
        requests:
          cpu: 50m
          # Grafana with provisioned dashboards/datasources idles ~300-350Mi;
          # the old 256Mi limit OOM-killed it (exit 137) in a restart loop,
          # which is what made the UI slow/flaky to load.
          memory: 256Mi
        limits:
          memory: 512Mi
      # "Node Exporter Full" (temperature + CPU/RAM/disk/net per host).
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            revision: 37
            datasource: VictoriaMetrics
