---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-stack
  namespace: monitoring
spec:
  interval: 1h
  # Pulls several images (operator, vmsingle, vmagent, grafana, ksm, node-exporter)
  # onto a small node — give the install room and let Flux remediate timeouts.
  timeout: 15m
  install:
    # The chart ships the operator CRDs as plain manifests (crds.plain below);
    # let Helm create/replace them so Flux applies CRD updates on upgrade too.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.85.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:
    victoria-metrics-operator:
      # Render CRDs as ordinary chart manifests (GitOps-friendly: no operator
      # job races, Helm + Flux manage them via install/upgrade.crds above).
      crds:
        plain: true

    # ---- Storage / query backend -------------------------------------------
    vmsingle:
      spec:
        retentionPeriod: "30d"
        # Pin to sowilo (15 GiB RAM) — node01 is a flaky 4 GiB guest and the
        # query backend needs headroom. Its Longhorn data has a replica here.
        nodeSelector:
          kubernetes.io/hostname: sowilo
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          resources:
            requests:
              # 4Gi did NOT hold 30d: it filled in ~32 days (3.8/3.9 GiB) and
              # vmsingle flipped to read-only (free 99.6 MB < the 100 MB default
              # -storage.minFreeDiskSpaceBytes), silently stopping ALL ingestion
              # while still answering historical queries. 156k series, ~46% of
              # them apiserver/etcd histogram buckets — now dropped at scrape
              # time, see vmagent.globalScrapeMetricRelabelConfigs below.
              #
              # 12Gi was first REJECTED by Longhorn's admission webhook
              # ("CheckReplicasSizeExpansion ... CurrentAvailable is less than
              # or equal to MinimalAvailable"): sowilo's root fs was 82% full,
              # so its Longhorn disk sat at Schedulable=False/DiskPressure —
              # below the 25% floor, which denies ANY expansion and any new
              # replica. Root cause was NOT Longhorn: a runaway json-file log
              # of the tgmusicbot Docker container (30.6 GiB in
              # /var/lib/docker/containers, ~3.4 GiB/day, no rotation
              # configured). Truncated -> 59.9 GiB free -> expansion allowed.
              # Keep an eye on `df /` on sowilo before raising this again.
              storage: 12Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            # 512Mi OOM-looped (exit 137) under the heavy "Node Exporter Full"
            # dashboard's range queries, which 500'd Grafana. 2Gi gives the TSDB
            # room to answer them (sowilo has 15 GiB).
            memory: 2Gi

    # ---- Scraper ------------------------------------------------------------
    vmagent:
      spec:
        # Pin to sowilo: node01 lives on the flaky robothost hypervisor. If the
        # scraper ran on node01 it would die at the same instant robothost
        # crashes, losing the pre-crash temp/CPU samples. On sowilo it keeps
        # scraping robothost (192.168.0.162) right up to the crash and survives
        # the node01 outage so monitoring/alerting stay up.
        nodeSelector:
          kubernetes.io/hostname: sowilo
        # Pick up every VMServiceScrape / VMStaticScrape across namespaces
        # (incl. our bare-metal VMStaticScrape in the monitoring ns).
        selectAllByDefault: true
        # Drop apiserver/etcd histogram buckets before ingestion. They were
        # ~72k of 156k series (apiserver_request_duration_seconds_bucket 23.4k,
        # etcd_request_duration_seconds_bucket 19k, request_sli 9.4k,
        # watch_list 6.7k, request_body_size 6k, watch_cache_read_wait 4.7k,
        # watch_events_sizes 3.1k) — the reason a 4Gi TSDB filled in a month on
        # a 2-node homelab. Cost: latency/SLO panels on the "Kubernetes / API
        # server" + "etcd" dashboards and the cluster_quantile:* recording
        # rules go empty. Hardware/node/pod metrics are untouched.
        # Applied as metric_relabel_configs to every scrape job.
        globalScrapeMetricRelabelConfigs:
          - action: drop
            source_labels: [__name__]
            regex: "(apiserver|etcd)_.*_bucket"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

    # ---- Alerting -----------------------------------------------------------
    defaultRules:
      enabled: true
    vmalert:
      enabled: true
      spec:
        # Pin to sowilo with the rest of the monitoring stack (survives node01 loss).
        nodeSelector:
          kubernetes.io/hostname: sowilo
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
    alertmanager:
      enabled: true
      spec:
        # Pin to sowilo so alerting fires even when node01 is down.
        nodeSelector:
          kubernetes.io/hostname: sowilo
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
      # Inline config. Receiver is a no-op for now — a real channel (Telegram/
      # email/Slack) gets wired in a follow-up via a SOPS secret + configSecret.
      config:
        route:
          receiver: "blackhole"
          group_by: ["alertname", "instance"]
        receivers:
          - name: "blackhole"

    # ---- Host & object exporters -------------------------------------------
    prometheus-node-exporter:
      enabled: true
      # Run on every node, including the control-plane/server node.
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          memory: 96Mi

    # ---- Dashboards ---------------------------------------------------------
    defaultDashboards:
      enabled: true

    # ---- Grafana ------------------------------------------------------------
    grafana:
      enabled: true
      # Pin to sowilo (away from the flaky node01); its Longhorn PVC has a
      # replica here so it stays put with its data.
      nodeSelector:
        kubernetes.io/hostname: sowilo
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 2Gi
        storageClassName: longhorn
      resources:
        requests:
          cpu: 50m
          # Grafana with provisioned dashboards/datasources idles ~300-350Mi;
          # the old 256Mi limit OOM-killed it (exit 137) in a restart loop,
          # which is what made the UI slow/flaky to load.
          memory: 256Mi
        limits:
          memory: 512Mi
      # "Node Exporter Full" (temperature + CPU/RAM/disk/net per host).
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            revision: 37
            datasource: VictoriaMetrics
