---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  # Longhorn pulls many images; on a slow/2-core node the default 5m install
  # wait expires before all DaemonSet pods are up. Give it room and let Flux
  # remediate a timed-out install instead of stalling.
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      defaultClass: true # the cluster's default StorageClass
      # sowilo joined as agent 2026-06-28 (docs/en/07). Two replicas now: every
      # new volume gets a copy on each node so an app survives a node failure.
      defaultClassReplicaCount: 2
    defaultSettings:
      defaultReplicaCount: 2
      # Don't schedule both replicas on the same node — one per node only.
      replicaSoftAntiAffinity: false
      # Off-site backups to Cloudflare R2 (S3-compatible). Creds + AWS_ENDPOINTS
      # live in the SOPS secret backup-secret.sops.yaml; the bucket is in the URL.
      # Region is a required placeholder R2 ignores. Set a RecurringJob per volume
      # (or a group) in the Longhorn UI to schedule snapshots->backups.
      backupTarget: s3://longhorn-backup@us-east-1/
      backupTargetCredentialSecret: longhorn-r2-backup
