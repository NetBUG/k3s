---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  # Longhorn pulls many images; on a slow/2-core node the default 5m install
  # wait expires before all DaemonSet pods are up. Give it room and let Flux
  # remediate a timed-out install instead of stalling.
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      defaultClass: true # the cluster's default StorageClass
      # One replica since 2026-10-14. Two (one per node, since 2026-06-28) cost
      # sowilo ~0.7 core of Longhorn CPU, and node01 kept dropping off the LAN
      # (e1000e hangs on nuc2), so every flap degraded and rebuilt every volume.
      # A single replica has no redundancy: losing sowilo's disk loses the
      # volume unless it has a backup. This sets only new volumes; existing
      # ones are cut to their sowilo replica by hand.
      defaultClassReplicaCount: 1
    defaultSettings:
      defaultReplicaCount: 1
      # Don't schedule both replicas on the same node — one per node only.
      replicaSoftAntiAffinity: false
      # NOTE: backup target is NOT set here — in Longhorn 1.12 it lives in the
      # BackupTarget CRD (backuptarget.yaml). defaultSettings.backupTarget only
      # seeds a FRESH install and doesn't update the existing `default` CR.
