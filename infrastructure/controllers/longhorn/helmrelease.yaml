---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      defaultClass: true # the cluster's default StorageClass
      # Single node until node2 joins (docs/en/07-second-node.md bumps this
      # to 2 and migrates existing volumes).
      defaultClassReplicaCount: 1
    defaultSettings:
      defaultReplicaCount: 1
      # Don't schedule replicas on the same node twice once node2 exists.
      replicaSoftAntiAffinity: false
