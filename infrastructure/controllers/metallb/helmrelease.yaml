---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  # IPAddressPool / L2Advertisement live in infrastructure/config
  # (they need the MetalLB CRDs from this release to exist first).
  values: {}
  # node01 (libvirt guest on robothost) sits on a failing NVMe that corrupts
  # freshly-pulled image layers -> frr-k8s crashloops with "exec format error".
  # node01 is cordoned + untrusted; keep the frr-k8s DaemonSet off it until the
  # disk is replaced. (speaker stays — it runs fine and is harmless there.)
  # Remove this block once robothost's NVMe is fixed and node01 is un-cordoned.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: metallb-frr-k8s
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: metallb-frr-k8s
              spec:
                template:
                  spec:
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: kubernetes.io/hostname
                                  operator: NotIn
                                  values:
                                    - node01
