---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.2
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  # Driver only — the media NFS share is consumed via a static PV
  # (infrastructure/config/media-nfs-pv.yaml), no dynamic provisioning needed.
  values: {}
