---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
    # Traefik VIP on the home LAN (192.168.1.0/24). Outside the Ubiquiti DHCP
    # range. Split-horizon DNS on the router points *.nb3.me service names here.
    - 192.168.1.100/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
  # Only sowilo sits on the LAN L2; node01 is a libvirt guest behind NAT and
  # must never answer ARP for the VIP. enp1s0 keeps the announcement off
  # wg0 and the docker bridges.
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: sowilo
  interfaces:
    - enp1s0
