---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
    # Traefik VIP — must be OUTSIDE the Mikrotik DHCP pool.
    # TODO: confirm addressing against the current LAN layout.
    - 192.168.5.200/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
