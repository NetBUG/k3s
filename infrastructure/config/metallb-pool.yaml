---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
    # Traefik VIP on the libvirt LAN (192.168.122.0/24). In use: .1 (gw),
    # .49, .134 (node1). .200 is free today — keep it OUT of the libvirt
    # DHCP range (shrink the dnsmasq range on the host if needed) so it is
    # never leased to another guest.
    - 192.168.122.200/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
