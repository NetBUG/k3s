---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production ACME (the 2022 setup used staging — one wildcard cert
    # stays far under Let's Encrypt rate limits).
    server: https://acme-v02.api.letsencrypt.org/directory
    email: darikcr@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - nb3.me
