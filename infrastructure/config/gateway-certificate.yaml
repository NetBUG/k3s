---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-nb3-me
  namespace: traefik # must live next to the Gateway that references it
spec:
  secretName: wildcard-nb3-me-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - nb3.me
    - "*.nb3.me"
