# LAN-only admin UIs (no login of their own). No tunnel entry in nb3_tf;
# ExternalDNS gives each name a LAN record pointing at the Traefik VIP.
---
# Longhorn dashboard: volumes, replicas, backups.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - longhorn.nb3.me
  rules:
    # LAN-only guard: a request that came through the Cloudflare tunnel always
    # carries Cf-Ray. Bounce it to the panel instead of serving an
    # unauthenticated admin UI, should a tunnel entry ever appear.
    - matches:
        - headers:
            - type: RegularExpression
              name: Cf-Ray
              value: ".+"
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: home.nb3.me
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - backendRefs:
        - name: longhorn-frontend
          port: 80
