apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # NOTE: CoreDNS HA (replicas=2) is set imperatively, NOT here — it's a
  # k3s-managed addon and the bundled manifest omits `replicas`, so `kubectl
  # scale deploy coredns -n kube-system --replicas=2` is durable (k3s won't
  # revert a field it doesn't own). Flux can't patch a single field of an
  # object it doesn't manage. See runs/ note.
  - metallb-pool.yaml
  - cluster-issuer.yaml
  - gateway.yaml
  - gateway-certificate.yaml
  - media-nfs-pv.yaml
  # Cloudflare API token for DNS-01 (SOPS-encrypted).
  - cf-api-token.sops.yaml
  # Monitoring CR instances (need the VM operator CRDs from infra-controllers).
  - monitoring
