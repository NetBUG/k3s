apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CoreDNS scaled to 2 (HA across nodes) — see coredns-ha.yaml.
  - coredns-ha.yaml
  - metallb-pool.yaml
  - cluster-issuer.yaml
  - gateway.yaml
  - gateway-certificate.yaml
  - media-nfs-pv.yaml
  # Cloudflare API token for DNS-01 (SOPS-encrypted).
  - cf-api-token.sops.yaml
  # Monitoring CR instances (need the VM operator CRDs from infra-controllers).
  - monitoring
