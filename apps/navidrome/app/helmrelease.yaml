---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: navidrome
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      navidrome:
        containers:
          app:
            image:
              repository: docker.io/deluan/navidrome
              tag: 0.61.2
            env:
              ND_MUSICFOLDER: /music
              ND_DATAFOLDER: /data
              ND_BASEURL: https://navidrome.nb3.me
              ND_SCANSCHEDULE: "@every 24h"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false

    service:
      app:
        controller: navidrome
        ports:
          http:
            port: 4533

    persistence:
      data:
        existingClaim: navidrome-data
        globalMounts:
          - path: /data
      music:
        existingClaim: music-ro
        globalMounts:
          - path: /music
            readOnly: true
