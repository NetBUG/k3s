---
# Navidrome state: the SQLite DB (users, playlists, stars, play counts) plus
# the artwork/transcode cache. 222MB today; 5Gi leaves room for cache growth.
#
# Longhorn rather than a hostPath under /media/data: the pod is already pinned
# to sowilo by the music mount, so Longhorn buys no mobility — it buys
# replication (a second copy on node01 once it is Ready again) and the ability
# to push the volume to the R2 backup target. /media/data lives on the single
# unmirrored sda2 SSD.
#
# Seeded once, before the app is enabled, from the Docker-era
# /media/data/navidrome — see apps/navidrome/seed-job.yaml. That directory is
# left untouched on disk as the rollback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: navidrome
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
