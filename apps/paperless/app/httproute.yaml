---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - paperless.nb3.me
  rules:
    - backendRefs:
        # bjw-s app-template names the Service <release>-<serviceKey> = paperless-app
        - name: paperless-app
          port: 8000
