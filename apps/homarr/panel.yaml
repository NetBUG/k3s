# Homarr panel layout — the source of truth for boards and app tiles.
# Applied by sync.py through the Homarr API; re-running it overwrites the
# managed boards, so edit here rather than in the UI.
#
# ${VAR} is substituted from the environment. The repo is public: anything
# that identifies the console (UNIFI_CLOUD_URL) stays out of this file.

icons: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg

apps:
  Navidrome:
    href: https://music.nb3.me
    icon: navidrome
  Immich:
    href: https://photos.nb3.me
    icon: immich
  Seafile:
    href: https://sync.nb3.me
    icon: seafile
  Paperless:
    href: https://paperless.nb3.me
    icon: paperless-ngx
  Syncthing:
    # Docker on sowilo, LAN only (no route through Traefik or the tunnel).
    href: http://192.168.1.125:8384
    icon: syncthing
  Grafana:
    href: https://grafana.nb3.me
    icon: grafana
  Home Assistant:
    href: https://ha.nb3.me
    icon: home-assistant
  UniFi:
    href: https://192.168.1.1
    icon: ubiquiti-unifi
  UniFi Cloud:
    href: ${UNIFI_CLOUD_URL}
    icon: ubiquiti-unifi
    title: UniFi

  # Machines: ssh:// links (the client's ssh handler, e.g. Terminal on macOS).
  # `ping` is required — without it Homarr pings the ssh:// href and shows red.
  # Every host runs node-exporter on :9100, reachable from the Homarr pod.
  sowilo (LAN):
    href: ssh://netbug@192.168.1.125
    ping: http://192.168.1.125:9100/metrics
    icon: ubuntu-linux
    title: sowilo
  sowilo (remote):
    # cloudflared access ssh — needs the ProxyCommand in ~/.ssh/config.
    href: ssh://netbug@sowilo.nb3.me
    ping: http://192.168.1.125:9100/metrics
    icon: ubuntu-linux
    title: sowilo
  cn62:
    href: ssh://netbug@192.168.1.99
    ping: http://192.168.1.99:9100/metrics
    icon: debian-linux
  nuc2:
    href: ssh://netbug@192.168.1.26
    ping: http://192.168.1.26:9100/metrics
    icon: debian-linux
  node01:
    # libvirt guest behind NAT on nuc2: no LAN address, so both boards use
    # the dedicated cloudflared tunnel.
    href: ssh://netbug@ssh-node.nb3.me
    ping: http://192.168.122.135:9100/metrics
    icon: ubuntu-linux

# Group membership per board. `public` is what anonymous WAN visitors see;
# `remote` is the logged-in default; `lan` is where LAN devices land
# (HTTPRoute redirect, see app/httproute.yaml).
boards:
  public:
    public: true
    groups:
      Public: [Navidrome, Immich, Seafile]
  remote:
    public: false
    groups:
      Public: [Navidrome, Immich, Seafile]
      Personal: [Paperless]
      Auxiliary: [Grafana, Home Assistant]
      Machines: [UniFi Cloud, sowilo (remote), node01]
  lan:
    public: false
    groups:
      Public: [Navidrome, Immich, Seafile]
      Personal: [Syncthing, Paperless]
      Auxiliary: [Grafana, Home Assistant]
      Machines: [UniFi, sowilo (LAN), cn62, nuc2, node01]

# Home board for anonymous visitors (global setting) and for the API key's
# user (the board shown after login over the WAN).
home:
  anonymous: public
  user: remote
