---
# Homarr panel on home.nb3.me. Boards, apps and integrations live in its SQLite
# DB (Longhorn) and are edited in the UI — see docs/en/11-homarr-panel.md for
# the board layout (panel.yaml + sync.py). Login is Homarr's own credentials provider.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
  namespace: homarr
spec:
  interval: 1h
  chart:
    spec:
      chart: homarr
      version: 8.34.1 # Homarr v2.4.1
      sourceRef:
        kind: HelmRepository
        name: homarr
        namespace: flux-system
  values:
    env:
      TZ: Europe/Moscow
      AUTH_PROVIDERS: credentials
      # Long session: each LAN device logs in once.
      AUTH_SESSION_EXPIRY_TIME: 365d
    database:
      type: sqlite
    envSecrets:
      dbEncryption:
        existingSecret: db-encryption
        key: db-encryption-key
    persistence:
      homarrDatabase:
        enabled: true
        storageClassName: longhorn
        size: 1Gi
    # Startup rewrites ~29k icon rows into SQLite; on a loaded node that blocks
    # the event loop long enough for the chart's 1s x 3 liveness probe to kill
    # it mid-job, in a loop (2026-10-13, node01 down, sowilo load 12). The
    # chart has no startupProbe, so the liveness probe tolerates ~3 minutes.
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 18
      httpGet:
        path: /api/health/live
        port: 7575
    # The route lives in httproute.yaml (LAN redirect rule).
    httproute:
      enabled: false
