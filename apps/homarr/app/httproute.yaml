---
# LAN vs WAN is decided here: every request through the Cloudflare tunnel
# carries Cf-Ray (Cloudflare re-adds it, a client cannot strip it); LAN
# requests via the MetalLB VIP do not. Verified 2026-10-13 with a whoami probe.
# A LAN client faking Cf-Ray only downgrades itself to the WAN behaviour.
#
#   GET /  without Cf-Ray (LAN) -> 302 /boards/lan
#   GET /  with Cf-Ray (WAN)    -> Homarr home (public board / user default)
#   anything else               -> Homarr
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homarr
  namespace: homarr
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - home.nb3.me
  rules:
    - matches:
        - path:
            type: Exact
            value: /
          headers:
            - type: RegularExpression
              name: Cf-Ray
              value: ".+"
      backendRefs:
        - name: homarr
          port: 7575
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /boards/lan
            statusCode: 302
    - backendRefs:
        - name: homarr
          port: 7575
