---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: asknavidrome
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-config
  interval: 1h
  path: ./apps/asknavidrome/app
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
