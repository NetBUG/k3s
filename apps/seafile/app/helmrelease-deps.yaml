---
# MariaDB + Redis. The official Seafile chart ships only the Seafile Deployment
# itself and expects both to exist already, so they live here on app-template —
# same idiom as paperless/immich.
#
# The notification server is deliberately NOT here: it needs the `seafile` MySQL
# user and the ccnet_db/seafile_db tables, which Seafile itself creates on first
# boot. Keeping it in this release deadlocked the rollout — Seafile waits for
# this release to go Ready, while the notification pod cannot start until
# Seafile has run. It now lives in helmrelease-notification.yaml, behind
# dependsOn: seafile.
#
# Image tags and container env are taken verbatim from the upstream compose
# (manual.seafile.com/13.0/repo/docker/ce/seafile-server.yml and
# notification-server.yml), not guessed: upstream still pins MariaDB 10.11.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seafile-deps
  namespace: seafile
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # The DB datadir is a hostPath on sowilo's array, so everything here is
    # pinned to that node. (Seafile itself is pinned by its local PV instead.)
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: sowilo

    controllers:
      mariadb:
        containers:
          app:
            image:
              repository: docker.io/library/mariadb
              tag: "10.11"
            env:
              # One source of truth: the same secret key Seafile uses to create
              # its databases on first boot. Drifting these apart breaks init.
              MARIADB_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: seafile-secret
                    key: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
              MYSQL_LOG_CONSOLE: "true"
              MARIADB_AUTO_UPGRADE: "1"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

      # Cache only. Upstream runs it with persistence explicitly off
      # (--save "" --appendonly no); a restart costs nothing but a cold cache.
      redis:
        containers:
          app:
            image:
              repository: docker.io/library/redis
              tag: "8.8.0"
            # args, not command — the image ENTRYPOINT must still run.
            args:
              - --requirepass
              - $(REDIS_PASSWORD)
              - --save
              - ""
              - --appendonly
              - "no"
            env:
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: seafile-secret
                    key: REDIS_PASSWORD
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      mariadb:
        controller: mariadb
        ports:
          mysql:
            port: 3306
      redis:
        controller: redis
        ports:
          redis:
            port: 6379

    persistence:
      db:
        type: hostPath
        hostPath: /media/Magic/seafile/db
        advancedMounts:
          mariadb:
            app:
              - path: /var/lib/mysql
