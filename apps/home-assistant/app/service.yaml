---
# Home Assistant runs outside the cluster (HAOS VM `haos` on cn62). A
# selector-less Service plus a hand-written EndpointSlice puts it behind the
# Gateway like any in-cluster app, so ExternalDNS gives ha.nb3.me a LAN record
# and the tunnel reaches it through Traefik.
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-1
  namespace: home-assistant
  labels:
    kubernetes.io/service-name: home-assistant
addressType: IPv4
ports:
  - name: http
    port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.27
    # Traefik skips endpoints without an explicit ready=true (unset counts
    # as ready per the API, but Traefik answered 503 "no servers").
    conditions:
      ready: true
