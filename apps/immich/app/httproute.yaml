---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - photos.nb3.me
  rules:
    - backendRefs:
        # bjw-s app-template names the Service <release>-<serviceKey> = immich-server
        - name: immich-server
          port: 2283
