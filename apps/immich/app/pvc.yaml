---
# ML model cache only. Photo library + Postgres data are hostPath on sowilo
# (see helmrelease.yaml) — deliberately NOT on Longhorn (terabytes / reused
# in place). This small cache is on Longhorn so models survive a restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
  namespace: immich
  labels:
    # Re-downloadable models: leave Longhorn's default backup group.
    recurring-job-source.longhorn.io: enabled
    recurring-job-group.longhorn.io/no-backup: enabled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
